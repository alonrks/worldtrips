                shortDesc: 'מתחם תעשייתי משוחזר עם חנויות וינטג\', מזכרות ומזקקות.',
                desc: 'בית חרושת היסטורי למכוניות מתחילת המאה ה-20 שהפך למוקד שופינג וינטג\' ייחודי. במתחם תמצאו את חנות האספנות האייקונית Antique Archaeology מתוכנית הטלוויזיה "American Pickers", מזקקות וויסקי וגלריות.',
                tip: 'מקום מעולה למציאת מזכרות ייחודיות ופריטי אספנות שאין בשום מקום אחר בעיר. החנויות נפתחות ב-10:00.',
                gmaps: 'https://www.google.com/maps/search/?api=1&query=Marathon+Village+Nashville'
            },
            {
                id: 'peg-leg-porker',
                title: 'Peg Leg Porker BBQ',
                category: 'food',
                catLabel: 'ברבקיו דרומי',
                day: 'monday',
                dayBadge: 'יום שני - צהריים (13:00)',
                lat: 36.1534,
                lng: -86.7818,
                color: '#10b981',
                icon: 'fa-drumstick-bite',
                address: '903 Gleaves St, Nashville, TN 37203',
                img: 'https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?auto=format&fit=crop&w=600&q=80',
                distance: '10 דק\' הליכה (0.8 ק"מ)',
                timeEst: 'שעה',
                shortDesc: 'ברבקיו מעושן אותנטי באיכות הגבוהה ביותר בשכונת The Gulch.',
                desc: 'מסעדת ברבקיו דרומית ידועה המגישה צלעות מעושנות (Dry Rub Ribs), בשר מפורק ותוספות מסורתיות כמו לחם תירס ומאק אנד צ\'יז.',
                tip: 'קחו מנה של Dry Rub Smoked Ribs יחד עם לחם התירס המפורסם שלהם. הישיבה בחצר העליונה מומלצת!',
                gmaps: 'https://www.google.com/maps/search/?api=1&query=Peg+Leg+Porker+BBQ+Nashville'
            },
            {
                id: 'twelve-south',
                title: 'שכונת 12 South',
                category: 'shopping',
                catLabel: 'בוטיקים & אופנה',
                day: 'monday',
                dayBadge: 'יום שני - אחה"צ (15:00)',
                lat: 36.1245,
                lng: -86.7895,
                color: '#10b981',
                icon: 'fa-store',
                address: '12th Ave S, Nashville, TN 37204',
                img: 'https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=600&q=80',
                distance: '8 דק\' נסיעה במונית (4.5 ק"מ)',
                timeEst: 'שעתיים עד 3 שעות',
                shortDesc: 'השכונה הטרנדית והנעימה ביותר לשופינג רגלי, קפה וציורי קיר.',
                desc: 'שדרה ציורית ויפהפייה המלאה בחנויות אופנה מעצבים (כמו Draper James של ריס וית\'רספון), בוטיקים לבית (White\'s Mercantile), בתי קפה מעולים וציור הקיר המפורסם "I Believe in Nashville".',
                tip: 'מומלץ לקחת קפה ב-Frothy Monkey ולטייל ברגל בין החנויות לאורך השדרה.',
                gmaps: 'https://www.google.com/maps/search/?api=1&query=12+South+Nashville'
            }
        ];

        let map;
        let markers = {};
        let activeDayFilter = 'all';
        let activeCategoryFilter = 'all';

        window.onload = function() {
            initMap();
            renderList();
        };

        function initMap() {
            // Centered near Downtown Nashville
            map = L.map('map', {
                zoomControl: false
            }).setView([36.1550, -86.7820], 14);

            // Add Zoom Control to bottom-right
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Dark/Sleek Map Tiles (CartoDB Positron / Dark Matter or Standard Voyager)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            // Draw Day Routes (Connecting Sunday and Monday stops)
            drawRoutes();

            // Add Markers
            locations.forEach(loc => {
                const customIcon = L.divIcon({
                    className: 'custom-leaflet-pin',
                    html: `<div class="custom-pin ${loc.id === 'hotel' ? 'pulse-marker' : ''}" style="background-color: ${loc.color}">
                            <i class="fa-solid ${loc.icon}"></i>
                           </div>`,
                    iconSize: [38, 38],
                    iconAnchor: [19, 19],
                    popupAnchor: [0, -20]
                });

                const marker = L.marker([loc.lat, loc.lng], { icon: customIcon }).addTo(map);

                // Popup Content
                const popupHtml = `
                    <div class="p-1 min-w-[200px]">
                        <div class="text-[10px] font-bold text-amber-400 mb-0.5">${loc.dayBadge}</div>
                        <h3 class="font-bold text-sm text-white mb-1">${loc.title}</h3>
                        <p class="text-xs text-slate-300 mb-2 line-clamp-2">${loc.shortDesc}</p>
                        <div class="text-[11px] text-slate-400 mb-3 flex items-center gap-1">
                            <i class="fa-solid fa-person-walking text-orange-400"></i> ${loc.distance}
                        </div>
                        <button onclick="openModal('${loc.id}')" class="w-full bg-orange-600 hover:bg-orange-500 text-white text-xs font-medium py-1.5 px-3 rounded-lg transition">
                            לפרטים מלאים וטיפים
                        </button>
                    </div>
                `;

                marker.bindPopup(popupHtml);
                markers[loc.id] = marker;
            });
        }

        function drawRoutes() {
            const sundayCoords = locations.filter(l => l.day === 'sunday' || l.day === 'hotel').map(l => [l.lat, l.lng]);
            const mondayCoords = locations.filter(l => l.day === 'monday' || l.day === 'hotel').map(l => [l.lat, l.lng]);

            // Sunday dashed line (Amber)
            L.polyline(sundayCoords, {
                color: '#f59e0b',
                weight: 3,
                opacity: 0.7,
                dashArray: '8, 8'
            }).addTo(map);

            // Monday dashed line (Emerald)
            L.polyline(mondayCoords, {
                color: '#10b981',
                weight: 3,
                opacity: 0.7,
                dashArray: '8, 8'
            }).addTo(map);
        }

        function renderList() {
            const listContainer = document.getElementById('location-list');
            listContainer.innerHTML = '';

            const filtered = locations.filter(loc => {
                const matchDay = activeDayFilter === 'all' || loc.day === activeDayFilter || loc.day === 'hotel';
                const matchCat = activeCategoryFilter === 'all' || loc.category === activeCategoryFilter;
                return matchDay && matchCat;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 text-slate-500">
                        <i class="fa-solid fa-location-crosshairs text-3xl mb-2"></i>
                        <p>לא נמצאו מקומות בקטגוריה הנבחרת.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(loc => {
                const isHotel = loc.id === 'hotel';
                const card = document.createElement('div');
                card.className = `bg-slate-800/70 hover:bg-slate-800 border ${isHotel ? 'border-indigo-500/50' : 'border-slate-700/60'} rounded-2xl p-4 transition-all duration-200 cursor-pointer shadow-lg hover:shadow-orange-500/5 group flex flex-col gap-3`;
                
                card.onclick = () => focusLocation(loc.id);

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white shrink-0 shadow-md group-hover:scale-105 transition" style="background-color: ${loc.color}">
                                <i class="fa-solid ${loc.icon} text-lg"></i>
                            </div>
                            <div>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isHotel ? 'bg-indigo-500/20 text-indigo-300' : loc.day === 'sunday' ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-300'} mb-1 inline-block">
                                    ${loc.dayBadge}
                                </span>
                                <h3 class="text-base font-bold text-white group-hover:text-orange-400 transition leading-snug">${loc.title}</h3>
                            </div>
                        </div>
                    </div>

                    <p class="text-xs text-slate-300 leading-relaxed">${loc.shortDesc}</p>

                    <div class="flex items-center justify-between text-xs text-slate-400 pt-2 border-t border-slate-700/50">
                        <span class="flex items-center gap-1">
                            <i class="fa-solid fa-person-walking text-orange-400"></i> ${loc.distance}
                        </span>
                        <button onclick="event.stopPropagation(); openModal('${loc.id}')" class="text-orange-400 font-medium hover:underline text-xs flex items-center gap-1">
                            פרטים נוספים <i class="fa-solid fa-arrow-left text-[10px]"></i>
                        </button>
                    </div>
                `;

                listContainer.appendChild(card);
            });
        }

        function focusLocation(id) {
            const loc = locations.find(l => l.id === id);
            if (!loc) return;

            map.flyTo([loc.lat, loc.lng], 16, { duration: 1.2 });
            markers[id].openPopup();
        }

        function resetMapView() {
            map.flyTo([36.1550, -86.7820], 14, { duration: 1 });
        }

        function filterDay(day) {
            activeDayFilter = day;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-orange-600', 'text-white', 'shadow-md');
                btn.classList.add('text-slate-400');
            });

            const activeBtn = document.getElementById(`tab-${day}`);
            activeBtn.classList.add('bg-orange-600', 'text-white', 'shadow-md');
            activeBtn.classList.remove('text-slate-400');

            renderList();
        }

        function filterCategory(cat) {
            activeCategoryFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('border-orange-500', 'bg-orange-500/10', 'text-orange-400');
            });
            event.currentTarget.classList.add('border-orange-500', 'bg-orange-500/10', 'text-orange-400');

            renderList();
        }

        function openModal(id) {
            const loc = locations.find(l => l.id === id);
            if (!loc) return;

            document.getElementById('modal-img').src = loc.img;
            document.getElementById('modal-title').innerText = loc.title;
            document.getElementById('modal-day-badge').innerText = loc.dayBadge;
            document.getElementById('modal-category').innerHTML = `<i class="fa-solid ${loc.icon}"></i> ${loc.catLabel}`;
            document.getElementById('modal-distance').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${loc.distance}`;
            document.getElementById('modal-time').innerHTML = `<i class="fa-solid fa-clock"></i> זמן מומלץ: ${loc.timeEst}`;
            document.getElementById('modal-desc').innerText = loc.desc;
            document.getElementById('modal-tip').innerText = loc.tip;
            document.getElementById('modal-address').innerText = loc.address;
            document.getElementById('modal-gmaps-link').href = loc.gmaps;

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
